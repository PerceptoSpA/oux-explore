name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Compilar
        env:
          # Ruta base del sitio. Mientras se publique en perceptospa.github.io/oux-explore
          # debe ser /oux-explore/. Al conectar el dominio propio, crear la variable
          # de repositorio BASE_PATH con valor "/" (Settings > Secrets and variables > Actions > Variables).
          BASE_PATH: ${{ vars.BASE_PATH || '/oux-explore/' }}
        run: npm run build

      - name: Preparar 404 para rutas de React
        run: cp out/index.html out/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
